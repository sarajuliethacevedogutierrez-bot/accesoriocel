<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Inicio de Sesión</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #fe4fb8, #fe00dc);
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            background-color: #ffffff;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.20);
        }

        .login-container h1 {
            text-align: center;
            color: #333333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            text-align: center;
            color: #777777;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333333;
            font-weight: bold;
        }

        .form-group input[type="text"],
        .form-group input[type="password"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #cccccc;
            border-radius: 8px;
            outline: none;
            font-size: 15px;
            transition: 0.3s;
        }

        .form-group input[type="text"]:focus,
        .form-group input[type="password"]:focus {
            border-color: #4facfe;
            box-shadow: 0 0 5px rgba(79, 172, 254, 0.4);
        }

        .remember {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 20px;
            color: #555555;
            font-size: 14px;
        }

        .remember input {
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        .login-button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(135deg, #fe4fec, #ff00e6);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .login-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 123, 255, 0.3);
        }

        .register {
            text-align: center;
            margin-top: 25px;
            color: #555555;
            font-size: 14px;
        }

        .register a,
        .home-link {
            color: #007bff;
            text-decoration: none;
            font-weight: bold;
        }

        .register a:hover,
        .home-link:hover {
            text-decoration: underline;
        }

        .home {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
        }

        @media (max-width: 480px) {
            .login-container {
                margin: 20px;
                padding: 30px 25px;
            }

            .login-container h1 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

    <main class="login-container">

        <h1>Iniciar Sesión</h1>

        <p class="subtitle">
            Ingresa tus datos para acceder a tu cuenta
        </p>

        <form class="login-form" action="#" method="post">

            <div class="form-group">
                <label for="username">Nombre de usuario:</label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Ingresa tu nombre de usuario"
                    autocomplete="username"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Contraseña:</label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Ingresa tu contraseña"
                    autocomplete="current-password"
                    required
                >
            </div>

            <label class="remember" for="remember">
                <input
                    type="checkbox"
                    id="remember"
                    name="remember"
                >
                No cerrar sesión
            </label>

            <button type="submit" class="login-button">
                Iniciar sesión
            </button>

        </form>

        <p class="register">
            ¿No tienes una cuenta?
            <a href="/frontend/assets/register.html">
                Regístrate
            </a>
        </p>

        <p class="home">
            <a href="/frontend/assets/index.html" class="home-link">
                ← Volver a la página de inicio
            </a>
        </p>

    </main>

</body>

</html>
