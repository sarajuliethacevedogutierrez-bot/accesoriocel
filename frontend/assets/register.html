<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Crear una cuenta</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #5004e8, #fe0077);
            padding: 30px 15px;
        }

        .register-container {
            width: 100%;
            max-width: 650px;
            background-color: #ffffff;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.20);
        }

        .register-container h1 {
            text-align: center;
            color: #333333;
            margin-bottom: 10px;
            font-size: 30px;
        }

        .subtitle {
            text-align: center;
            color: #777777;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group.full-width {
            grid-column: 1 / -1;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333333;
            font-weight: bold;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 1px solid #cccccc;
            border-radius: 8px;
            outline: none;
            font-size: 15px;
            background-color: #ffffff;
            transition: 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: #4facfe;
            box-shadow: 0 0 5px rgba(79, 172, 254, 0.4);
        }

        .form-help {
            display: block;
            margin-top: 5px;
            font-size: 12px;
            color: #888888;
        }

        .register-button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(135deg, #4facfe, #007bff);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .register-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 123, 255, 0.3);
        }

        .login-link {
            text-align: center;
            margin-top: 25px;
            color: #555555;
            font-size: 14px;
        }

        .login-link a,
        .home-link {
            color: #007bff;
            text-decoration: none;
            font-weight: bold;
        }

        .login-link a:hover,
        .home-link:hover {
            text-decoration: underline;
        }

        .home {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
        }

        @media (max-width: 600px) {

            .register-container {
                padding: 30px 20px;
            }

            .register-container h1 {
                font-size: 25px;
            }

            .form-row {
                grid-template-columns: 1fr;
                gap: 0;
            }

            .form-group.full-width {
                grid-column: auto;
            }
        }
    </style>
</head>

<body>

    <main class="register-container">

        <h1>Crear una cuenta</h1>

        <p class="subtitle">
            Completa el siguiente formulario para registrarte
        </p>

        <form action="#" method="post">

            <div class="form-row">

                <!-- Nombre -->
                <div class="form-group">
                    <label for="nombre">Nombre:</label>

                    <input
                        type="text"
                        id="nombre"
                        name="nombre"
                        placeholder="Ingresa tu nombre"
                        autocomplete="given-name"
                        required
                    >
                </div>

                <!-- Apellido -->
                <div class="form-group">
                    <label for="apellido">Apellido:</label>

                    <input
                        type="text"
                        id="apellido"
                        name="apellido"
                        placeholder="Ingresa tu apellido"
                        autocomplete="family-name"
                        required
                    >
                </div>

                <!-- Correo -->
                <div class="form-group full-width">
                    <label for="correo">Correo electrónico:</label>

                    <input
                        type="email"
                        id="correo"
                        name="correo"
                        placeholder="ejemplo@correo.com"
                        autocomplete="email"
                        required
                    >
                </div>

                <!-- Tipo de documento -->
                <div class="form-group">
                    <label for="identidad">Tipo de documento:</label>

                    <select id="identidad" name="identidad" required>
                        <option value="">Seleccione</option>
                        <option value="cc">Cédula de ciudadanía</option>
                        <option value="ti">Tarjeta de identidad</option>
                        <option value="ce">Cédula de extranjería</option>
                        <option value="pasaporte">Pasaporte</option>
                    </select>
                </div>

                <!-- Número de documento -->
                <div class="form-group">
                    <label for="numero-doc">Número de documento:</label>

                    <input
                        type="text"
                        id="numero-doc"
                        name="numero_documento"
                        placeholder="Número de documento"
                        inputmode="numeric"
                        required
                    >
                </div>

                <!-- Cédula extranjera -->
                <div class="form-group">
                    <label for="cedula-extranjera">
                        Cédula de extranjería:
                    </label>

                    <input
                        type="text"
                        id="cedula-extranjera"
                        name="cedula_extranjera"
                        placeholder="Opcional"
                    >
                </div>

                <!-- Pasaporte -->
                <div class="form-group">
                    <label for="pasaporte">Pasaporte:</label>

                    <input
                        type="text"
                        id="pasaporte"
                        name="pasaporte"
                        placeholder="Opcional"
                    >
                </div>

                <!-- Dirección -->
                <div class="form-group full-width">
                    <label for="direccion">Dirección:</label>

                    <input
                        type="text"
                        id="direccion"
                        name="direccion"
                        placeholder="Ingresa tu dirección"
                        autocomplete="street-address"
                        required
                    >
                </div>

                <!-- Teléfono -->
                <div class="form-group">
                    <label for="telefono">Teléfono:</label>

                    <input
                        type="tel"
                        id="telefono"
                        name="telefono"
                        placeholder="Número de teléfono"
                        autocomplete="tel"
                        required
                    >
                </div>

                <!-- Contraseña -->
                <div class="form-group">
                    <label for="contrasena">Contraseña:</label>

                    <input
                        type="password"
                        id="contrasena"
                        name="contrasena"
                        placeholder="Crea una contraseña"
                        autocomplete="new-password"
                        minlength="8"
                        required
                    >

                    <span class="form-help">
                        Mínimo 8 caracteres.
                    </span>
                </div>

                <!-- Confirmar contraseña -->
                <div class="form-group full-width">
                    <label for="confirmar-contrasena">
                        Confirmar contraseña:
                    </label>

                    <input
                        type="password"
                        id="confirmar-contrasena"
                        name="confirmar_contrasena"
                        placeholder="Repite tu contraseña"
                        autocomplete="new-password"
                        minlength="8"
                        required
                    >
                </div>

                <!-- Botón -->
                <div class="form-group full-width">
                    <button type="submit" class="register-button">
                        Crear cuenta
                    </button>
                </div>

            </div>

        </form>

        <p class="login-link">
            ¿Ya tienes una cuenta?
            <a href="/frontend/assets/login.html">
                Iniciar sesión
            </a>
        </p>

        <p class="home">
            <a href="/frontend/assets/index.html" class="home-link">
                ← Volver a la página de inicio
            </a>
        </p>

    </main>

</body>

</html>
